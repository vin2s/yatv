[package]
name = "yatv"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Standalone Android TV voice controller for Yandex Station"
publish = false

[dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls", "json", "socks-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
